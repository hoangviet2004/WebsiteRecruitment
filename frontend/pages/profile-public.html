<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ công khai — TechList</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="stylesheet" href="../assets/css/profile-public.css">
</head>
<body>
    <nav class="homebar" style="background:rgba(255,255,255,0.98);border-bottom:1px solid #eee;">
        <div class="left">
            <a href="home.html" class="logo-svg"><img src="../assets/logo.svg" alt="Logo">TechList</a>
            <ul>
                <li><a href="jobs.html">Tìm việc</a></li>
                <li><a href="#">Công ty</a></li>
            </ul>
        </div>
        <div class="right" id="nav-right"></div>
    </nav>

    <!-- Skeleton loading -->
    <div id="pub-skeleton" class="pub-skeleton-page">
        <div class="pub-skeleton-hero"></div>
        <div class="pub-skeleton-body">
            <div class="pub-skeleton-card"></div>
            <div class="pub-skeleton-card"></div>
        </div>
    </div>

    <!-- Main content (ẩn cho đến khi load xong) -->
    <div id="pub-content" style="display:none;">

        <!-- Hero banner -->
        <div class="pub-hero">
            <div class="pub-hero-inner">
                <div class="pub-hero-avatar-wrap">
                    <img id="pub-avatar" src="" alt="Avatar" class="pub-avatar">
                    <span id="pub-status-dot" class="pub-status-dot" title=""></span>
                </div>
                <div class="pub-hero-info">
                    <h1 id="pub-name">—</h1>
                    <p id="pub-title" class="pub-hero-title"></p>
                    <div class="pub-hero-meta">
                        <span id="pub-location" style="display:none;">
                            <i class="fa-solid fa-location-dot"></i> <span id="pub-location-text"></span>
                        </span>
                        <span id="pub-status-badge" class="pub-seeking-badge" style="display:none;"></span>
                    </div>
                </div>
                <div class="pub-hero-actions" id="pub-hero-actions">
                    <a id="pub-cv-btn" href="#" target="_blank" class="pub-btn-primary" style="display:none;">
                        <i class="fa-solid fa-download"></i> Tải CV
                    </a>
                    <button class="pub-btn-secondary" onclick="copyProfileLink()">
                        <i class="fa-solid fa-share-nodes"></i> Chia sẻ
                    </button>
                </div>
            </div>
        </div>

        <!-- Body 2 cột -->
        <div class="pub-body">

            <!-- Cột chính -->
            <div class="pub-main-col">

                <!-- Giới thiệu bản thân -->
                <div id="pub-bio-card" class="pub-card" style="display:none;">
                    <div class="pub-card-title"><i class="fa-regular fa-user"></i> Giới thiệu</div>
                    <p id="pub-bio" class="pub-bio-text"></p>
                </div>

                <!-- Kinh nghiệm -->
                <div id="pub-exp-card" class="pub-card" style="display:none;">
                    <div class="pub-card-title"><i class="fa-solid fa-briefcase"></i> Kinh nghiệm làm việc</div>
                    <div id="pub-exp-list" class="pub-timeline"></div>
                </div>

                <!-- Học vấn -->
                <div id="pub-edu-card" class="pub-card" style="display:none;">
                    <div class="pub-card-title"><i class="fa-solid fa-graduation-cap"></i> Học vấn</div>
                    <div id="pub-edu-list" class="pub-timeline"></div>
                </div>

            </div>

            <!-- Cột phụ -->
            <div class="pub-side-col">

                <!-- Kỹ năng -->
                <div id="pub-skills-card" class="pub-card" style="display:none;">
                    <div class="pub-card-title"><i class="fa-solid fa-star-half-stroke"></i> Kỹ năng</div>
                    <div id="pub-skills-list"></div>
                </div>

                <!-- Social links -->
                <div id="pub-social-card" class="pub-card" style="display:none;">
                    <div class="pub-card-title"><i class="fa-solid fa-link"></i> Liên kết</div>
                    <div id="pub-social-list" class="pub-social-list"></div>
                </div>

            </div>
        </div>
    </div>

    <!-- Error state -->
    <div id="pub-error" style="display:none;" class="pub-error-page">
        <i class="fa-solid fa-user-slash pub-error-icon"></i>
        <h2>Không tìm thấy hồ sơ</h2>
        <p>Hồ sơ này không tồn tại hoặc chưa được công khai.</p>
        <a href="jobs.html" class="pub-btn-primary">Tìm việc làm</a>
    </div>

    <!-- Toast -->
    <div id="pub-toast" class="pub-toast" style="display:none;"></div>

    <script src="../js/api.js"></script>
    <script src="../js/home.js"></script>
    <script src="../js/profile-public.js"></script>
</body>
</html>
