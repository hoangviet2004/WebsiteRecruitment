<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Tin Tuyển Dụng</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/sidebar.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>

<div id="sidebar-container"></div>

<main class="admin-content">
    <div class="admin-header">
        <h1><i class="fa-solid fa-briefcase"></i> Quản Lý Tin Tuyển Dụng</h1>
        <p class="subtitle">Phê duyệt và quản lý các tin tuyển dụng trên hệ thống.</p>
    </div>

    <!-- Toolbar -->
    <div class="am-toolbar">
      <div class="am-search-wrap">
        <i class="fa-solid fa-magnifying-glass am-search-icon"></i>
        <input type="text" id="job-search" class="am-search-input" placeholder="Tìm theo tiêu đề hoặc doanh nghiệp..." oninput="filterJobs()" autocomplete="off">
      </div>
      <div class="am-select-wrap">
        <i class="fa-solid fa-filter am-select-icon"></i>
        <select id="job-filter-status" class="am-select" onchange="filterJobs()">
          <option value="">Tất cả trạng thái</option>
          <option value="pending">Chờ duyệt</option>
          <option value="active">Đã duyệt & Hiện</option>
          <option value="hidden">Đang ẩn</option>
          <option value="blocked">Bị từ chối</option>
        </select>
      </div>
    </div>

    <div class="data-card">
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tiêu đề</th>
                        <th>Doanh nghiệp</th>
                        <th>Trạng Thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="job-table-body">
                    <tr><td colspan="4" style="text-align: center;">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- ═══════════════════════════════════════════════════════════
     MODAL: TỪ CHỐI TIN TUYỂN DỤNG
     ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-block-job">
  <div class="modal-card" style="max-width:480px;">
    <div class="modal-header">
      <h2><i class="fa-solid fa-ban"></i> Từ chối tin tuyển dụng</h2>
      <button class="modal-close-btn" onclick="closeBlockModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <p style="margin:0 0 14px;color:#475569;font-size:14px;">Vui lòng chọn lý do từ chối tin tuyển dụng này.</p>
      <select id="block-reason-select" onchange="onBlockReasonChange()"
        style="width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;color:#0f172a;">
        <option value="">-- Chọn lý do --</option>
        <option value="Nội dung tin tuyển dụng không rõ ràng hoặc thiếu thông tin">Nội dung không rõ ràng hoặc thiếu thông tin</option>
        <option value="Tin tuyển dụng có dấu hiệu lừa đảo">Có dấu hiệu lừa đảo</option>
        <option value="Mức lương hoặc quyền lợi không thực tế">Mức lương / quyền lợi không thực tế</option>
        <option value="Vi phạm quy định của nền tảng">Vi phạm quy định của nền tảng</option>
        <option value="Tin trùng lặp hoặc spam">Tin trùng lặp hoặc spam</option>
        <option value="other">Lý do khác...</option>
      </select>
      <textarea id="block-reason-input" rows="3"
        style="display:none;width:100%;margin-top:10px;padding:12px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;resize:vertical;outline:none;box-sizing:border-box;"
        placeholder="Nhập lý do khác..."></textarea>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
        <button onclick="closeBlockModal()" style="padding:9px 20px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;color:#475569;font-size:14px;font-weight:600;cursor:pointer;">Hủy</button>
        <button onclick="confirmBlockJob()" style="padding:9px 20px;border:none;border-radius:8px;background:#ef4444;color:#fff;font-size:14px;font-weight:600;cursor:pointer;"><i class="fa-solid fa-ban" style="margin-right:6px;"></i>Xác nhận từ chối</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════════════
     MODAL: CHI TIẾT TIN TUYỂN DỤNG
     ═══════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-job-detail">
  <div class="modal-card" style="max-width:720px;max-height:90vh;overflow-y:auto;">
    <div class="modal-header">
      <h2><i class="fa-solid fa-briefcase"></i> Chi tiết tin tuyển dụng</h2>
      <button class="modal-close-btn" onclick="document.getElementById('modal-job-detail').classList.remove('open')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body" id="job-detail-body">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/guard.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/jobManagement.js"></script>

<script>
  requireAdmin();
  loadSidebar();
</script>

</body>
</html>
