<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>TechList - Xác thực</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>

<body>

    <div class="container">
        <div class="card">

            <a href="../pages/home.html" class="logo-svg">
                <img src="../assets/logo.svg" alt="Logo">
                TechList
            </a>
            <p class="subtitle" id="subtitle">Tìm kiếm công việc mơ ước của bạn</p>

            <!-- ĐĂNG KÝ -->
            <div id="panel-register">
                <form id="registerForm" novalidate>
                    <div class="auth-field">
                        <label for="reg-fullname">Họ và tên</label>
                        <input type="text" id="reg-fullname" placeholder="Nguyễn Văn A"
                               maxlength="50" autocomplete="name"
                               oninput="clearErr('reg-fullname-err')">
                        <span class="auth-err" id="reg-fullname-err"></span>
                    </div>

                    <div class="auth-field">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" placeholder="example@email.com"
                               maxlength="100" autocomplete="email"
                               oninput="clearErr('reg-email-err')">
                        <span class="auth-err" id="reg-email-err"></span>
                    </div>

                    <div class="auth-field">
                        <label for="reg-role">Bạn là</label>
                        <select id="reg-role">
                            <option value="Candidate">🎯 Ứng viên đang tìm việc</option>
                            <option value="Recruiter">🏢 Nhà tuyển dụng</option>
                        </select>
                    </div>

                    <div class="auth-field">
                        <label for="reg-password">Mật khẩu</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự"
                                   maxlength="100" autocomplete="new-password"
                                   oninput="onRegPassInput(this.value); clearErr('reg-password-err')">
                            <span onclick="togglePassword('reg-password', this)">
                                <i class="fa-regular fa-eye"></i>
                            </span>
                        </div>
                        <div class="auth-strength" id="reg-strength" style="display:none;">
                            <div class="auth-strength-bar" id="reg-strength-bar"></div>
                            <span class="auth-strength-label" id="reg-strength-label"></span>
                        </div>
                        <span class="auth-err" id="reg-password-err"></span>
                    </div>

                    <div class="auth-field">
                        <label for="reg-confirm">Xác nhận mật khẩu</label>
                        <div class="password-wrapper">
                            <input type="password" id="reg-confirm" placeholder="Nhập lại mật khẩu"
                                   maxlength="100" autocomplete="new-password"
                                   oninput="clearErr('reg-confirm-err')">
                            <span onclick="togglePassword('reg-confirm', this)">
                                <i class="fa-regular fa-eye"></i>
                            </span>
                        </div>
                        <span class="auth-err" id="reg-confirm-err"></span>
                    </div>

                    <div class="auth-global-err" id="reg-global-err" style="display:none;"></div>

                    <button type="submit" id="btn-register">Đăng ký</button>
                </form>

                <div class="divider">Tiếp tục với</div>
                <div class="social">
                    <button class="google"><i class="fa-brands fa-google"></i> Google</button>
                    <button class="github"><i class="fa-brands fa-github"></i> GitHub</button>
                </div>

                <p class="switch-text">
                    Bạn đã có tài khoản?
                    <a href="#" onclick="showPanel('login')">Đăng nhập</a>
                </p>
            </div>

            <!-- ĐĂNG NHẬP -->
            <div id="panel-login" style="display: none;">
                <form id="loginForm" novalidate>
                    <div class="auth-field">
                        <label for="login-email">Email</label>
                        <input type="email" id="login-email" placeholder="example@email.com"
                               maxlength="100" autocomplete="email"
                               oninput="clearErr('login-email-err')">
                        <span class="auth-err" id="login-email-err"></span>
                    </div>

                    <div class="auth-field">
                        <label for="login-password">Mật khẩu</label>
                        <div class="password-wrapper">
                            <input type="password" id="login-password" placeholder="Nhập mật khẩu"
                                   maxlength="100" autocomplete="current-password"
                                   oninput="clearErr('login-password-err')">
                            <span onclick="togglePassword('login-password', this)">
                                <i class="fa-regular fa-eye"></i>
                            </span>
                        </div>
                        <span class="auth-err" id="login-password-err"></span>
                    </div>

                    <div class="forgot-row">
                        <a href="#" onclick="showPanel('forgot')">Quên mật khẩu?</a>
                    </div>

                    <div class="auth-global-err" id="login-global-err" style="display:none;"></div>

                    <button type="submit" id="btn-login">Đăng nhập</button>
                </form>

                <div class="divider">Tiếp tục với</div>
                <div class="social">
                    <button class="google"><i class="fa-brands fa-google"></i> Google</button>
                    <button class="github"><i class="fa-brands fa-github"></i> GitHub</button>
                </div>

                <p class="switch-text">
                    Chưa có tài khoản?
                    <a href="#" onclick="showPanel('register')">Đăng ký ngay</a>
                </p>
            </div>

            <!-- QUÊN MẬT KHẨU -->
            <div id="panel-forgot" style="display: none;">
                <p class="forgot-desc">Nhập email để nhận liên kết đặt lại mật khẩu.</p>
                <form id="forgotForm">
                    <label>Email</label>
                    <input type="email" required>
                    <button type="submit">Gửi liên kết</button>
                </form>

                <p class="switch-text">
                    <a href="#" onclick="showPanel('login')">← Quay lại đăng nhập</a>
                </p>
            </div>

            <!-- CHỌN VAI TRÒ (OAuth lần đầu) -->
            <div id="panel-select-role" style="display: none;">
                <p class="role-pick-desc">Đây là lần đầu bạn đăng nhập.<br>Bạn muốn dùng TechList với tư cách nào?</p>
                <div class="role-cards">
                    <button class="role-card" data-role="Candidate">
                        <i class="fa-solid fa-user-graduate"></i>
                        <span class="role-card-title">Ứng viên</span>
                        <span class="role-card-desc">Tìm kiếm việc làm phù hợp</span>
                    </button>
                    <button class="role-card" data-role="Recruiter">
                        <i class="fa-solid fa-building"></i>
                        <span class="role-card-title">Nhà tuyển dụng</span>
                        <span class="role-card-desc">Đăng tin và tìm nhân tài</span>
                    </button>
                </div>
                <div class="auth-global-err" id="role-global-err" style="display:none;"></div>
            </div>

        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
